[project]
name = "ds-project"
version = "0.1.0"
description = "Workspace tooling for data science notebooks, scripts, apps, reports, and slide decks."
requires-python = ">=3.11"
dependencies = [
    "jupyterlab",
    "jupytext",        # keeps notebooks/py/*.py and notebooks/*.ipynb in sync
    "nbstripout",      # strips cell outputs from .ipynb on git commit/diff
    "python-pptx",     # builds .pptx slide decks (presentation skill)
    "pypandoc-binary", # exports markdown reports to .docx (bundles pandoc)
]

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C90", "SIM"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"notebooks/py/*.py" = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
